name: Notify Slack on Push and PRs

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Step 2: Detect event type
      - name: Set event info
        id: event
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "type=push" >> $GITHUB_OUTPUT
            echo "msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.head_commit.url }}" >> $GITHUB_OUTPUT
            echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
            echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          else
            echo "type=pr" >> $GITHUB_OUTPUT
            echo "msg=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
            echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.action }}" >> $GITHUB_OUTPUT
          fi

      # ✅ Step 3: Send Slack notification
      - name: Send notification to Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "TechHub Bot 🤖"
          SLACK_COLOR: "#36a64f"
          SLACK_FOOTER: "GitHub → Slack Integration | Powered by Mahmoud Raslan"

          SLACK_TITLE: |
            ${{ steps.event.outputs.type == 'push' && '🚀 New Commit in TechHub Repository' || '📦 Pull Request Update' }}

          SLACK_MESSAGE: |
            ${{ steps.event.outputs.type == 'push' && format('*Commit by:* {0}\n*Branch:* `{1}`\n*Message:* _{2}_\n🔗 [View Commit]({3})', steps.event.outputs.actor, steps.event.outputs.branch, steps.event.outputs.msg, steps.event.outputs.url)
            || format('*PR by:* {0}\n*Action:* _{1}_\n*Title:* {2}\n🔗 [View PR]({3})', steps.event.outputs.actor, steps.event.outputs.action, steps.event.outputs.msg, steps.event.outputs.url) }}

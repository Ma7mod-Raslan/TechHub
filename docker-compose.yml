services:
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    restart: always

  chatbot:
    build: ./chatbot
    container_name: chatbot
    env_file:
      - ./chatbot/.env
    restart: always

  frontend:
    build:
      context: .
    container_name: frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - chatbot
      - frontend
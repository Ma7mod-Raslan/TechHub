server {
    listen 80;
    server_name techhub-learn.com www.techhub-learn.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name techhub-learn.com www.techhub-learn.com;

    ssl_certificate /etc/letsencrypt/live/techhub-learn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techhub-learn.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

        location /api/compiler/ws {
    proxy_pass http://localhost:5000;  # change 3000 to your backend port
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}

    location /api/ {
        # ── WebSocket upgrade support ──────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ───────────────────────────────────────────────────────

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600;
            return 204;
        }

        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ── Static uploads (certificates, avatars, etc.) ──────────────────────────
    # Proxied to the backend so Express static middleware serves the files.
    # This MUST be a separate block — the /api/ block above won't catch /uploads/.
    location /uploads/ {
        proxy_pass http://backend:5000;

        add_header 'Access-Control-Allow-Origin' 'http://localhost' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Cache static files in the browser for 7 days
        add_header Cache-Control "public, max-age=604800, immutable";
    }



    location /chatbot/ {
        proxy_pass http://chatbot:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
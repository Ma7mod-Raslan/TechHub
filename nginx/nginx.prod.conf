server {
    listen 80;
    server_name techhub-learn.com www.techhub-learn.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name techhub-learn.com www.techhub-learn.com;

    ssl_certificate /etc/letsencrypt/live/techhub-learn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techhub-learn.com/privkey.pem;

    # ── Frontend ───────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Compiler WebSocket (must be before /api/ block) ────────────────────────
    location /api/compiler/ws {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ✅ Keep WebSocket alive for up to 35s
        # (slightly more than our 30s backend timeout)
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # ── API (REST) ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600;
            return 204;
        }

        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ── Static uploads ─────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── Chatbot ────────────────────────────────────────────────────────────────
    location /chatbot/ {
        proxy_pass http://chatbot:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}